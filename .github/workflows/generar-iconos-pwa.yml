name: Generar iconos PWA ACTIVO
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generar-iconos-pwa.yml'
      - 'img/logo-activo-nuevo.png'
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install pillow
      - name: Generar iconos para iPhone y Android
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Image.open("img/logo-activo-nuevo.png").convert("RGBA")
          source.thumbnail((460, 460), Image.Resampling.LANCZOS)
          Path("img/icons").mkdir(parents=True, exist_ok=True)
          for size in (180, 192, 512):
              icon = Image.new("RGBA", (size, size), "#111827")
              art = Image.open("img/logo-activo-nuevo.png").convert("RGBA")
              art.thumbnail((round(size*.90), round(size*.90)), Image.Resampling.LANCZOS)
              icon.alpha_composite(art, ((size-art.width)//2, (size-art.height)//2))
              icon.convert("RGB").save(f"img/icons/icon-{size}.png")
          PY
      - name: Guardar iconos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add img/icons/
          if ! git diff --cached --quiet; then
            git commit -m "Generate ACTIVO PWA icons"
            git push
          fi
