
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="ACTIVO Funcional Training - Planificaciones de entrenamiento">
  <title>ACTIVO | Planificaciones</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .logo-activo {
      display: block;
      max-width: 230px;
      width: 100%;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>

<body>

  <header>
    <div class="head">
      <div class="brand">
        <img
          src="img/logo-activo-nuevo.png"
          alt="ACTIVO Funcional Training"
          class="logo-activo"
        >
      </div>

      <button id="adminTop" type="button">
        Panel del profesor
      </button>
    </div>
  </header>

  <main>

    <section id="public">

      <div class="card">
        <h2>Buscá tu planificación</h2>

        <input
          id="search"
          type="search"
          placeholder="Nombre o apellido"
          autocomplete="off"
        >

        <div id="results"></div>
      </div>

      <div id="publicPlan" class="card hidden"></div>

      <div id="studentTimer" class="card rest-timer hidden">

        <h3>⏱ Cronómetro de descanso</h3>

        <small>Controlá tu descanso entre series</small>

        <div
          id="timerDisplay"
          class="timer-display"
          role="timer"
        >
          01:30
        </div>

        <div class="timer-presets">
          <button type="button" class="timer-preset" data-seconds="30">
            30 s
          </button>

          <button type="button" class="timer-preset" data-seconds="60">
            60 s
          </button>

          <button type="button" class="timer-preset active" data-seconds="90">
            90 s
          </button>

          <button type="button" class="timer-preset" data-seconds="120">
            2 min
          </button>
        </div>

        <div class="timer-controls">
          <button id="timerStart" type="button">
            ▶ Iniciar
          </button>

          <button id="timerPause" type="button">
            ⏸ Pausar
          </button>

          <button id="timerReset" type="button">
            ↻ Reiniciar
          </button>
        </div>

        <div id="timerStatus" aria-live="polite">
          Listo para iniciar
        </div>

      </div>

    </section>

    <section id="admin" class="hidden">

      <div class="card bar">

        <div>
          <h2>Panel del profesor</h2>
          <small id="email"></small>
        </div>

        <div>
          <button id="libraryBtn" type="button">
            📚 Biblioteca
          </button>

          <button id="logout" type="button" class="danger">
            Cerrar sesión
          </button>
        </div>

      </div>

      <div id="msg" aria-live="polite"></div>

      <div class="grid">

        <div class="card">

          <h3>👥 Clientes</h3>

          <label for="name">Nombre y apellido</label>
          <input
            id="name"
            type="text"
            placeholder="Nombre del alumno"
          >

          <label for="goal">Objetivo</label>
          <input
            id="goal"
            type="text"
            placeholder="Objetivo del entrenamiento"
          >

          <label for="notes">Observaciones privadas</label>
          <textarea
            id="notes"
            rows="3"
            placeholder="Observaciones del profesor"
          ></textarea>

          <label for="active">
            <input id="active" type="checkbox" checked>
            Activo y visible
          </label>

          <div class="row">
            <button id="saveClient" type="button">
              Guardar cliente
            </button>

            <button id="cancel" type="button" class="hidden">
              Cancelar
            </button>
          </div>

          <input id="editId" type="hidden">

          <div id="clients"></div>

        </div>

        <div class="card">
          <div id="empty">
            Seleccioná un cliente para comenzar.
          </div>

          <div id="planner" class="hidden">

            <h2 id="clientTitle"></h2>
            <small id="clientGoal"></small>

            <!-- Pestañas de entrenamiento por día -->
            <div id="days" class="days"></div>

            <!-- Ejercicios del día seleccionado -->
            <div id="exerciseList"></div>

            <div class="row">

              <button id="manual" type="button">
                + Agregar manual
              </button>

              <button id="fromLib" type="button">
                Elegir de biblioteca
              </button>

              <button
                id="saveDay"
                type="button"
                class="success"
              >
                Guardar este día
              </button>

              <button id="preview" type="button">
                Ver como cliente
              </button>

            </div>
          </div>
        </div>

      </div>
    </section>

  </main>

  <!-- ACCESO DE PROFESORES -->

  <div id="loginModal" class="modal hidden">

    <div class="box">

      <h2>Panel del profesor</h2>

      <label for="loginEmail">
        Correo electrónico
      </label>

      <input
        id="loginEmail"
        type="email"
        placeholder="Correo electrónico"
        autocomplete="username"
      >

      <label for="loginPass">
        Contraseña
      </label>

      <input
        id="loginPass"
        type="password"
        placeholder="Ingresá tu contraseña"
        autocomplete="current-password"
      >

      <div
        id="loginErr"
        class="error hidden"
        role="alert"
      ></div>

      <div class="row">

        <button id="login" type="button">
          Ingresar
        </button>

        <button id="closeLogin" type="button">
          Cancelar
        </button>

      </div>

    </div>
  </div>

  <!-- BIBLIOTECA DE EJERCICIOS -->

  <div id="libraryModal" class="modal hidden">

    <div class="box wide">

      <div class="bar">

        <h2>Biblioteca de ejercicios</h2>

        <button id="closeLib" type="button">
          Cerrar
        </button>

      </div>

      <div class="row">

        <input
          id="libSearch"
          type="search"
          placeholder="Buscar ejercicio"
          autocomplete="off"
        >

        <select id="libCat">
          <option value="">
            Todas las categorías
          </option>
        </select>

      </div>

      <div id="library" class="library"></div>

    </div>
  </div>

  <!-- FUNCIONES DE LA APLICACIÓN -->
  <script src="app.js"></script>

</body>
</html>
