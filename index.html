
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#111827"
  >

  <title>ACTIVO | Planificaciones</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ======================================
       ENCABEZADO - ACTIVO 3.0
  ======================================= -->

  <header>
    <div class="head">

    
<div class="brand">
  <img
    src="Logo deportivo ACTIVO con corredor estilizado.png"
    alt="ACTIVO Funcional Training"
    class="logo-activo"
  >
</div>


      <button id="adminTop" type="button">
        Panel del profesor
      </button>

    </div>
  </header>

  <main>

    <!-- ======================================
         VISTA PÚBLICA - ALUMNOS
    ======================================= -->

    <section id="public">

      <div class="card">

        <h2>Buscá tu planificación</h2>

        <input
          id="search"
          type="search"
          placeholder="Nombre o apellido"
          autocomplete="off"
          aria-label="Buscar alumno"
        >

        <div id="results"></div>

      </div>

      <!-- PLANIFICACIÓN DEL ALUMNO -->

      <div
        id="publicPlan"
        class="card hidden"
      ></div>

      <!-- ===================================
           CRONÓMETRO DEL ALUMNO
      ==================================== -->

      <div
        id="studentTimer"
        class="card rest-timer hidden"
      >

        <div class="timer-header">

          <div>

            <h3>⏱ Cronómetro de descanso</h3>

            <small>
              Controlá tu descanso entre series
            </small>

          </div>

        </div>

        <div
          id="timerDisplay"
          class="timer-display"
          role="timer"
          aria-live="off"
        >
          01:30
        </div>

        <!-- TIEMPOS PREDEFINIDOS -->

        <div class="timer-presets">

          <button
            type="button"
            class="timer-preset"
            data-seconds="30"
          >
            30 s
          </button>

          <button
            type="button"
            class="timer-preset"
            data-seconds="60"
          >
            60 s
          </button>

          <button
            type="button"
            class="timer-preset active"
            data-seconds="90"
          >
            90 s
          </button>

          <button
            type="button"
            class="timer-preset"
            data-seconds="120"
          >
            2 min
          </button>

        </div>

        <!-- CONTROLES DEL CRONÓMETRO -->

        <div class="timer-controls">

          <button
            type="button"
            id="timerStart"
            class="timer-start"
          >
            ▶ Iniciar
          </button>

          <button
            type="button"
            id="timerPause"
          >
            ⏸ Pausar
          </button>

          <button
            type="button"
            id="timerReset"
          >
            ↻ Reiniciar
          </button>

        </div>

        <div
          id="timerStatus"
          class="timer-status"
          aria-live="polite"
        >
          Listo para iniciar
        </div>

      </div>

      <!-- FIN DEL CRONÓMETRO -->

    </section>

  <!-- ======================================
       INICIO DE SESIÓN DE PROFESORES
  ======================================= -->

  <div
    id="loginModal"
    class="modal hidden"
  >

    <div class="box">

      <h2>Panel del profesor</h2>

      <label for="loginEmail">
        Correo electrónico
      </label>

      <input
        id="loginEmail"
        type="email"
        placeholder="Correo electrónico"
        autocomplete="username"
      >

      <label for="loginPass">
        Contraseña
      </label>

      <input
        id="loginPass"
        type="password"
        placeholder="Ingresá tu contraseña"
        autocomplete="current-password"
      >

      <div
        id="loginErr"
        class="error hidden"
        role="alert"
      ></div>

      <div class="row">

        <button
          id="login"
          type="button"
        >
          Ingresar
        </button>

        <button
          id="closeLogin"
          type="button"
        >
          Cancelar
        </button>

      </div>

    </div>

  </div>

  <!-- ======================================
       BIBLIOTECA DE EJERCICIOS
  ======================================= -->

  <div
    id="libraryModal"
    class="modal hidden"
  >

    <div class="box wide">

      <div class="bar">

        <h2>Biblioteca de ejercicios</h2>

        <button
          id="closeLib"
          type="button"
        >
          Cerrar
        </button>

      </div>

      <!-- BUSCADOR DE EJERCICIOS -->

      <div class="row">

        <input
          id="libSearch"
          type="search"
          placeholder="Buscar ejercicio"
          autocomplete="off"
          aria-label="Buscar ejercicio"
        >

        <select
          id="libCat"
          aria-label="Categoría de ejercicio"
        >

          <option value="">
            Todas las categorías
          </option>

        </select>

      </div>

      <!-- RESULTADOS DE LA BIBLIOTECA -->

      <div
        id="library"
        class="library"
      ></div>

    </div>

  </div>

  <!-- ======================================
       CONEXIÓN CON LA APLICACIÓN
  ======================================= -->

  <script src="app.js"></script>

</body>
</html>
